name: Build Track Lab

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install librosa numpy mutagen soundfile pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --onedir --windowed --name TrackLab --collect-all librosa --collect-all soundfile --collect-all lazy_loader track_lab_gui.py
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TrackLab -DestinationPath TrackLab-windows.zip
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/TrackLab.app TrackLab-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TrackLab-${{ runner.os }}
          path: TrackLab-*.zip
